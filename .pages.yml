# Pages CMS editor setup (https://app.pagescms.org).
# Defines the forms you edit the site with. Every save is a commit to main.

media:
  input: media
  output: /media
  extensions: [gif, png, jpg, jpeg, webp, mp4, webm]

content:
  - name: home
    label: Home page
    type: file
    path: index.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
        default: home
      - name: title
        label: Page title (browser tab)
        type: string
      - name: heading
        label: Big heading
        type: string
      - name: body
        label: Intro
        type: rich-text
        options:
          format: markdown

  - name: kits
    label: Kits
    type: collection
    path: _kits
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      fields: [title, status, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Kit name
        type: string
        required: true
      - name: order
        label: Position on the home page (1 = first)
        type: number
      - name: status
        type: select
        options:
          values: [Released, In development]
      - name: version
        label: Version (optional, e.g. 1.3)
        type: string
      - name: tagline
        label: One-line pitch
        type: string
      - name: icon
        label: Kit icon (square PNG; leave empty for a lettered ring)
        type: image
      - name: curseforge
        label: CurseForge link
        type: string
      - name: command
        label: Settings slash command (e.g. /fak)
        type: string
      - name: body
        label: Intro text (optional, shown above the sections)
        type: rich-text
        options:
          format: markdown
      - name: blocks
        label: Sections
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "{fields.heading}"
        blockKey: type
        blocks:
          - name: text
            label: Text
            fields:
              - name: heading
                type: string
              - name: body
                label: Text
                type: rich-text
                options:
                  format: markdown

          - name: media
            label: GIF / image / video
            fields:
              - name: file
                label: GIF, image or video (mp4 plays like a GIF)
                type: file
                options:
                  categories: [image, video]
              - name: side
                label: Layout
                type: select
                default: full
                options:
                  values:
                    - { name: full, label: "Full width, text below" }
                    - { name: left, label: "Media left, text right" }
                    - { name: right, label: "Media right, text left" }
              - name: heading
                type: string
              - name: body
                label: Text
                type: rich-text
                options:
                  format: markdown
              - name: caption
                type: string

          - name: gallery
            label: Gallery (several GIFs side by side)
            fields:
              - name: heading
                type: string
              - name: items
                label: Pictures
                type: object
                list: true
                fields:
                  - name: file
                    label: GIF, image or video
                    type: file
                    options:
                      categories: [image, video]
                  - name: caption
                    type: string

          - name: features
            label: Feature list
            fields:
              - name: heading
                type: string
              - name: items
                label: Features
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.title}"
                fields:
                  - name: title
                    type: string
                  - name: text
                    type: text
                  - name: icon
                    label: Icon (optional)
                    type: image

          - name: callout
            label: Callout box
            fields:
              - name: style
                type: select
                default: Note
                options:
                  values: [Note, Tip, Warning]
              - name: heading
                type: string
              - name: body
                label: Text
                type: rich-text
                options:
                  format: markdown
