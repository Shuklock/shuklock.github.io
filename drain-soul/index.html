<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shardlock Idle — a warlock idle game</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<style>
:root{
  --bg:#0c0a12;--bg2:#15111f;--panel:#1b1626;--panel2:#231c33;--line:#352b4a;
  --text:#e6ddf5;--muted:#9a8db3;--fel:#7fe03a;--shadow:#9b5cff;--fire:#ff7a2a;
  --hp:#c43b3b;--hp2:#5a1a1a;--gold:#e8b94a;--xp:#8a5cff;
  --c0:#bdbdbd;--c1:#1eff00;--c2:#0070dd;--c3:#a335ee;--c4:#ff8000;
  box-sizing:border-box;color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c0a12;--text:#e6ddf5;}}
:root[data-theme="dark"],:root[data-theme="light"]{--bg:#0c0a12;--text:#e6ddf5;}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;-webkit-text-size-adjust:none;text-size-adjust:none}
/* Chrome on Android inflates text inside frames; a max-height on the block switches that heuristic off */
.row,.row *,.list,.list *,#win,#win *{max-height:999999px}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.4;-webkit-user-select:none;user-select:none}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--shadow)}
button:disabled{opacity:.4;cursor:not-allowed}
select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.muted{color:var(--muted)}
.t0{color:var(--c0)}.t1{color:var(--c1)}.t2{color:var(--c2)}.t3{color:var(--c3)}.t4{color:var(--c4)}
.gem{width:11px;height:11px;transform:rotate(45deg);border-radius:2px;display:inline-block}
.r0{background:var(--c0)}.r1{background:var(--c1)}.r2{background:var(--c2)}.r3{background:var(--c3)}.r4{background:var(--c4)}
/* stage */
#stage{position:fixed;inset:0;cursor:pointer;z-index:0}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
.zonename{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7);text-shadow:0 1px 3px #000;text-align:center;margin-bottom:3px}
/* HUD */
.hud{position:fixed;z-index:3;pointer-events:none}
.hud>*{pointer-events:auto}
.panel{background:linear-gradient(180deg,rgba(22,16,32,.82),rgba(10,8,16,.86));border:1px solid rgba(190,160,255,.18);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
h1,h2,h3,.gem-slot .n,.lvlline,#pname,#mname,.bar .lbl,#wintitle,.zonename{font-family:Cinzel,"Segoe UI",system-ui,serif;letter-spacing:.02em}
#mname{font-weight:700}
#mframe.camp #soulwrap,#mframe.camp #auras,#mframe.camp #mobcast{display:none!important}#mframe.camp #mdesc a{pointer-events:auto}
#soulwrap.elite{border-color:var(--gold);box-shadow:0 0 12px rgba(232,185,74,.45)}
#soulwrap.infernal{border-color:var(--fire);box-shadow:0 0 12px rgba(255,122,42,.5)}
.gem{box-shadow:0 0 6px currentColor}
.gem.r0{color:#bdbdbd}.gem.r1{color:#1eff00}.gem.r2{color:#0070dd}.gem.r3{color:#a335ee}.gem.r4{color:#ff8000}
:root{--topw:min(560px,calc(100vw - 530px))}
#hudT{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:var(--topw);display:flex;flex-direction:column;gap:6px}
.lvlline{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;gap:8px}
.gems{display:flex;gap:6px;margin-top:6px}
.gem-slot{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border-radius:8px;background:rgba(255,255,255,.04);cursor:default}
.gem-slot .gem{width:14px;height:14px;margin:3px}
.gem-slot .n{font-size:13px;font-variant-numeric:tabular-nums;line-height:1}
.gem-slot.main .n{font-size:16px;font-weight:700}
.gem-slot .r{font-size:9px;color:var(--muted);line-height:1}
.gem-slot.active{background:rgba(255,255,255,.1)}
.bar{position:relative;height:16px;background:rgba(21,17,31,.9);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:4px 0}
.bar>div{height:100%;transition:width .06s linear}
.bar .hp{background:linear-gradient(90deg,var(--hp2),var(--hp))}
.bar .xp{background:linear-gradient(90deg,#3b2a6e,var(--xp))}
.bar .soul{background:linear-gradient(90deg,#6b1a1a,#d94a3a)}
.bar .cast{background:linear-gradient(90deg,#3b2a6e,var(--shadow));transition:none}
.bar .cast.life{background:linear-gradient(90deg,#2f5a1a,#6fcf3a)}
.bar .cast.bolt{background:linear-gradient(90deg,#5a2a7a,#c9a6ff)}
.bar.tall{height:22px}
.bar .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;text-shadow:0 1px 2px #000}
.ticks{position:absolute;inset:0;display:flex;pointer-events:none}
.ticks span{flex:1;border-right:2px solid rgba(255,255,255,.28)}
.ticks span:last-child{border-right:none}
#hudTR{top:calc(10px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:8px;align-items:flex-start}
.head{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:10px;background:rgba(10,8,16,.78);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.head .face{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d9b89a,#8a6a4a 70%);border:2px solid #6a4a2a;position:relative;flex:none}
.head .face::after{content:"";position:absolute;inset:-6px -4px auto -4px;height:22px;border-radius:50% 50% 0 0;background:#3a2a5a}
.head .lbl{font-size:12px;line-height:1.2}
.head .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#c43b3b;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.head.ready{border-color:var(--fel);box-shadow:0 0 10px rgba(127,224,58,.4)}
.head{position:relative}
.boltfloat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(248px + env(safe-area-inset-bottom,0px));width:min(420px,70vw);z-index:3;pointer-events:none}
.boltfloat .bar{height:22px;margin:0;background:rgba(10,8,16,.8);border-color:#6a4fa0;box-shadow:0 2px 10px rgba(0,0,0,.6)}
#hudB{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100vw - 120px))}
#tpanel{position:relative}
#soulwrap.grey{border-color:#6a2a2a}
.evbar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-top:4px}.evbar>div{height:100%;background:var(--fire)}
.castwrap{width:min(480px,100%);margin:0 auto 6px}
.castwrap .bar{height:20px;margin:3px 0;border-color:#4a3a6a}
/* unit frames: pinned under each actor in the scene (positioned from script) */
.unit{position:fixed;z-index:3;transform:translateX(-50%);width:min(220px,36vw);pointer-events:none;padding:5px 7px 6px;border-radius:9px;background:rgba(10,8,16,.62);border:1px solid rgba(190,160,255,.16);box-shadow:0 4px 14px rgba(0,0,0,.45)}
.unit.mob{width:min(250px,38vw)}
.unit .uname{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;text-shadow:0 1px 2px #000;margin-bottom:2px}
.unit .uname.c{justify-content:center;text-align:center}
.unit h2{font-size:16px;line-height:1.2;text-shadow:0 2px 4px #000}
.unit .bar{margin:3px 0}.unit .bar.tall{height:18px}
.unit .auras{justify-content:center;min-height:0;margin-top:3px}
.unit .auras:empty{display:none}
.unit .dot{pointer-events:auto;cursor:help}
.unit .mdesc{font-size:10.5px;line-height:1.3;text-align:center;margin-top:3px;text-shadow:0 1px 2px #000}
.unit .corpse{font-size:11px;margin:4px 0 0}
.auras{display:flex;gap:6px;flex-wrap:wrap;min-height:20px;margin-top:4px}
.dot{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);background:var(--bg2)}
.dot.sh{border-color:var(--shadow)}.dot.fi{border-color:var(--fire)}.dot.cu{border-color:var(--c1)}.dot.gd{border-color:var(--gold)}
.pulse{animation:pulse .35s ease-out}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(155,92,255,.6)}to{box-shadow:0 0 0 14px rgba(155,92,255,0)}}
.abilities{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin-top:8px}
.abilities button,.abilities .empty{position:relative;height:48px;padding:0;font-size:11px;overflow:hidden;background:rgba(35,28,51,.9);display:grid;place-items:center;border:1px solid var(--line);border-radius:7px}
.abilities .empty{background:rgba(18,13,28,.5);border-style:dashed;opacity:.5}
.abilities button.craft{border-style:dashed}
.abilities .ico{width:30px;height:30px;border-radius:6px;background:#120d1c;border:1px solid #3a2d52;display:grid;place-items:center;flex:none}
.abilities .ico svg{width:22px;height:22px}
.abilities button.on .ico{border-color:var(--fel);box-shadow:0 0 6px rgba(127,224,58,.5)}
.abilities button .cdfill{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.5);pointer-events:none}
.abilities button.on{border-color:var(--fel);background:#1f3317}
.abilities .key,.abilities .empty .key{position:absolute;top:1px;left:4px;font-size:9px;color:var(--muted)}
.abilities .lb{display:none}
.abilities .cdt{position:absolute;bottom:1px;right:4px;font-size:10px;text-shadow:0 1px 2px #000}
.abilities .eat{margin-left:6px;border-color:#6a5a3a}
.abilities button:disabled{opacity:.5}
.corpse{background:#3a1515;border:1px solid #8a2a2a;padding:6px;border-radius:8px;text-align:center;margin:4px 0}
#brand{position:fixed;left:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;text-decoration:none;cursor:pointer}#brand:hover img{filter:drop-shadow(0 0 10px rgba(201,166,255,.65)) drop-shadow(0 3px 8px rgba(0,0,0,.7))}#brand:hover,#brand:focus-visible{z-index:30}#brand .brandtip{position:absolute;left:0;bottom:calc(100% + 8px);width:220px;font-style:normal;font-size:12px;line-height:1.45;color:#ddd;background:rgba(12,9,20,.95);border:1px solid rgba(201,166,255,.35);border-radius:8px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.6);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;pointer-events:none}#brand .brandtip b{display:block;color:#f1e6c8;margin-bottom:2px}#brand:hover .brandtip,#brand:focus-visible .brandtip{opacity:1;transform:none}#brand img{width:96px;height:96px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7))}#brand span{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#f1e6c8;text-shadow:0 1px 2px #000;background:rgba(12,9,20,.82);border:1px solid rgba(201,166,255,.25);border-radius:999px;padding:3px 10px 3px 12px;margin-top:-6px}@media (max-width:1199px){#brand img{width:72px;height:72px}#brand span{display:none}}@media (max-width:999px){#brand{display:none}}
#hudBR{right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px}
.menu button{width:46px;height:46px;padding:0;display:grid;place-items:center;font-size:18px;position:relative;background:rgba(10,8,16,.85)}
.menu button small{position:absolute;bottom:2px;right:4px;font-size:9px;color:var(--muted)}
.menu button.on{border-color:var(--fel)}
.menu button .badge{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#c43b3b;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.menu button.glow{border-color:var(--gold);box-shadow:0 0 10px rgba(232,185,74,.5)}
.menu button .star{position:absolute;top:-7px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1a1026;font-size:12px;line-height:1;display:grid;place-items:center;font-weight:700;pointer-events:none}
.menu button.ready{border-color:var(--gold);animation:readyPulse 1.4s ease-in-out infinite}
@keyframes readyPulse{0%,100%{box-shadow:0 0 5px rgba(232,185,74,.3)}50%{box-shadow:0 0 16px rgba(232,185,74,.95)}}
#tip{position:fixed;z-index:7;max-width:280px;background:rgba(10,8,16,.96);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;pointer-events:none;display:none;box-shadow:0 6px 20px rgba(0,0,0,.6)}
#tip b{display:block;font-size:13px;margin-bottom:2px}
#tip .muted{display:block;margin-top:3px}
#notice{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(10,8,16,.9);border:1px solid var(--gold);border-radius:12px;padding:18px 26px;text-align:center;font-size:20px;color:var(--gold);text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .4s}
#notice.show{opacity:1;pointer-events:auto;cursor:pointer}
#notice .gains{display:block;text-align:left;font-size:13px;color:var(--text);margin-top:10px;line-height:1.7}
#notice .gains b{margin-right:6px}
#notice .dismiss{display:block;font-size:11px;color:var(--muted,#9a8f7a);margin-top:8px;text-align:center}
#coach{position:fixed;z-index:8;left:16px;top:50%;transform:translateY(-50%);width:300px;max-width:calc(100vw - 32px);background:rgba(10,8,16,.96);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.6);display:none;font-size:13px;line-height:1.5}
#coach.show{display:block}
#coach h4{margin:0 0 6px;font-size:16px;color:var(--gold)}
#coach p{margin:0 0 8px}
#coach .cnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
#coach .cdots{font-size:11px;color:var(--muted,#9a8fb0)}
#coach .cnav button.go{background:#3a2d12;border-color:var(--gold);color:var(--gold)}
#coach .skip{background:none;border:none;color:var(--muted,#9a8fb0);padding:4px;font-size:12px;text-decoration:underline}
.coachhl{outline:2px solid var(--gold)!important;outline-offset:3px;border-radius:8px;animation:coachPulse 1.2s ease-in-out infinite}
@keyframes coachPulse{0%,100%{outline-color:rgba(232,185,74,.35)}50%{outline-color:rgba(232,185,74,1)}}
@media (max-width:700px){#coach{left:50%;top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(340px,calc(100vw - 24px));padding:10px 12px;font-size:12px}#coach h4{font-size:14px}}
#notice small{display:block;font-size:13px;color:var(--text);margin-top:6px}
#hudBL{left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:min(300px,calc((100vw - var(--topw))/2 - 20px))}
#pframe.dead .bar .hp{background:linear-gradient(90deg,#3a1515,#5a2a2a)}
.log{font-size:11px;color:var(--muted);max-height:112px;overflow:hidden;cursor:pointer;padding:4px 8px;background:rgba(10,8,16,.5);border-radius:8px}
.log.open{max-height:340px;overflow:auto;background:rgba(10,8,16,.85)}
.log div.good{color:var(--fel)}.log div.bad{color:#ff6b6b}.log div.loot{color:var(--c3)}.log div.lvl{color:var(--gold)}
#banners{display:flex;flex-direction:column;gap:6px}
#banners .event button{white-space:nowrap}
.event{background:#4a2010;border:1px solid var(--fire);border-radius:8px;padding:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
/* windows */
#win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100vw - 20px));max-height:min(78vh,760px) !important;display:none;flex-direction:column;z-index:5;background:rgba(14,11,20,.96);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.7)}
#win.open{display:flex}
@media (min-width:901px){#win.wide{width:min(1080px,calc(100vw - 20px));max-height:min(92vh,900px) !important}}
#win .titlebar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#win .titlebar h3{font-size:15px}
.winbody{display:flex;min-height:0;flex:1}
#wintabs{display:flex;flex-direction:column;gap:4px;padding:10px 6px;border-right:1px solid var(--line);width:120px;flex:none;overflow:auto}
#wintabs button{text-align:left;font-size:12px;padding:6px 8px;background:transparent;border-color:transparent}
#wintabs button.on{background:var(--panel2);border-color:var(--line)}
.list{display:flex;flex-direction:column;gap:6px;overflow:auto;padding:12px;flex:1;min-width:0}
.list>*{flex:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.row.owned{border-color:#2d4a1f}
.row.locked{opacity:.55}
.row .n{font-weight:600;font-size:14px;line-height:1.3}
.row .n .muted,.row .n small,.row .n .lv-grey,.row .n .lv-green,.row .n .lv-yellow,.row .n .lv-orange,.row .n .lv-red{font-size:12px;font-weight:400}
.row .d{font-size:12px;color:var(--muted);line-height:1.35}
.row .d span{font-size:12px}
.row .cost{font-size:12px;white-space:nowrap;text-align:right}
.row button{white-space:nowrap}
.row button.on{border-color:var(--fel);background:#1f3317}
.tier{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 0}
.mapz.click{cursor:pointer;user-select:none;border-radius:6px}.mapz.click:hover{background:rgba(255,255,255,.05)}.mapz .caret{display:inline-block;width:12px;color:var(--muted,#9d92b3)}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:1px 0}
.doll{position:relative;width:280px;height:320px;margin:0 auto;background:radial-gradient(ellipse at center,#2a1a3f,#15111f 75%);border:1px solid var(--line);border-radius:10px}
.doll svg.fig{position:absolute;left:70px;top:20px;width:140px;height:290px}
.slot{position:absolute;width:50px;height:50px;border:2px solid #3a2d52;border-radius:8px;background:#120d1c;display:grid;place-items:center;font-size:11px;color:var(--muted);cursor:pointer;text-align:center;line-height:1.1}
.slot.q0{border-color:#8a8a8a}.slot.q1{border-color:var(--c1)}.slot.q2{border-color:#4aa3ff}.slot.q3{border-color:var(--c3)}.slot.q4{border-color:var(--c4)}
.slot.sel,.bagslot.sel{outline:2px solid var(--fel)}
.slot .lb{font-size:9px;text-transform:uppercase;letter-spacing:.05em}
.bag{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.bagslot{aspect-ratio:1;border:2px solid #2d2440;border-radius:6px;background:#120d1c;display:grid;place-items:center;font-size:11px;cursor:pointer;position:relative;color:var(--text)}
.bagslot.empty{opacity:.45;cursor:default}
.bagslot.q0{border-color:#8a8a8a}.bagslot.q1{border-color:var(--c1)}.bagslot.q2{border-color:#4aa3ff}.bagslot.q3{border-color:var(--c3)}.bagslot.q4{border-color:var(--c4)}
.bagslot.junk{border-color:#6a6a6a;color:#bdbdbd}
.bagslot .cnt{position:absolute;right:3px;bottom:1px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000}
.detail{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.treecols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
@media (max-width:900px){.treecols{grid-template-columns:1fr}}
.tree{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px}
.tree h3{font-size:13px;padding:4px;display:flex;justify-content:space-between}
.ttier{display:flex;align-items:center;gap:8px;margin:18px 0 6px;padding:5px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:rgba(255,209,56,.07);border-top:2px solid var(--gold);border-radius:0 0 4px 4px}
.ttier:first-of-type{margin-top:6px}
.ttier small{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.ttier.lock{color:var(--muted);background:rgba(255,255,255,.03);border-top-color:var(--line)}
.tal.locked{opacity:.45}

function interrupt(source){let hit=false;const stop=att=>{if(!att.cast)return;const nm=att.cast.name;att.cast=null;att.castCd=Math.max(att.castCd||0,source==='spelllock'?12:8);fly('Interrupted: '+nm,'#ff9c3a',null,null,false,'dmg');hit=true;};stop(S);if(source==='spelllock'||source==='coil')(S.adds||[]).forEach(stop);return hit;}
function mobRarity(m){return m.ev?1:(m.elite?(m.n==='Ragnaros'?4:3):(S.mobRar||0));}
function rollRarity(m,kind){
  if(m.ev){const z=S.zone;const r=Math.random();if(z>=5&&r<.005)return 4;if(r<.02*(z+1))return 3;return 1;}
  if(m.elite)return 1; // boss ticks pay Uncommon; the kill pays the pile (see complete)
  let r=mobRarity(m);
  if(kind==='death'&&S.coaT>0&&!m.elite&&!m.ev&&r<4&&Math.random()<.1)r++;
  return r;}
function fmt(n){if(!isFinite(n))return '∞';if(n<1000)return (Math.round(n*10)/10).toString();const u=['K','M','B','T','Qa','Qi'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++;}return n.toFixed(2)+u[i];}

function costStr(c){return Object.keys(c).filter(k=>c[k]>0).map(k=>k==='g'?`<span style="color:var(--gold)">${goldStr(c[k])}</span>`:`<span class="t${k}">${fmt(c[k])} ${RAR[k]}</span>`).join(' + ')||'free';}

    ctx.globalAlpha=.9;ctx.fillStyle=core;ctx.beginPath();ctx.moveTo(px,py-r*1.6);ctx.lineTo(px+r,py);ctx.lineTo(px,py+r*1.6);ctx.lineTo(px-r,py);ctx.closePath();ctx.fill();ctx.globalAlpha=.35;ctx.fillStyle=color;ctx.beginPath();ctx.arc(px,py,r*2.2,0,Math.PI*2);ctx.fill();}

// seeded shapes per zone+layer so the hills are stable between frames
function seeded(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280;};}
const layerCache={};
function layerPoints(z,li){const key=z+':'+li;if(layerCache[key])return layerCache[key];const rnd=seeded(z*7+li*13+1);const style=ZONE_ART[z].style;const pts=[];const n=24;
  for(let i=0;i<=n;i++){let h;const t=i/n;
    if(style==='mesa')h=(li===0?.55:.35)+(rnd()<.35?.25:0)*(li===0?1:.5);
    else if(style==='peaks')h=(li===0?.25:.5)+Math.abs(Math.sin(i*1.7+li))*(li===0?.6:.2)+rnd()*.1;
    else if(style==='forest')h=.4+rnd()*.15*(li+1);
    else if(style==='core')h=.3+rnd()*.5;
    else if(style==='dunes')h=.45+Math.sin(i*.9+li*2)*.12+rnd()*.05;

function drawLayer(ctx,w,h,z,li,offset,color,baseY,amp,flatTop){
  const pts=layerPoints(z,li);const n=pts.length-1;const segW=w*1.4/n;const x0=-(offset%segW)-segW;
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x0,h);
  for(let i=0;i<=n+3;i++){const p=pts[i%n];const x=x0+i*segW;const y=baseY-p*amp;if(flatTop){ctx.lineTo(x,y);ctx.lineTo(x+segW*.6,y);}else ctx.lineTo(x,y);}
  ctx.lineTo(x0+(n+4)*segW,h);ctx.closePath();ctx.fill();}

  if(!S.event){S.eventT-=dt;if(S.eventT<=0&&S.corpse<=0&&S.lvl>=5){S.event={t:45};S.eventT=(180+Math.random()*120)/(1+.25*perk('rain'));log('An Infernal crashes down nearby! 45 seconds.','lvl');}}
  else{if(S.fighting!=='ev')S.event.t-=dt;if(S.event.t<=0){S.event=null;log('The Infernal burns out and leaves.');if(S.fighting==='ev'){S.fighting=null;spawn();}}}

  else{
    if(tal('intensity')&&S.corpse<=0&&S.eatT<=0&&S.soul>0){S.autoT=(S.autoT||0)+dt;const iv=[12,9,7,5,4][tal('intensity')-1];if(S.autoT>=iv){S.autoT-=iv;boltLand();}}
    if(S.mode!=='life'){S.prog+=youTps()*dt;while(S.prog>=1&&S.soul>0){S.prog-=1;S.chanN=((S.chanN||0)+1)%5;tick('you');}}
    if(tal('impfunnel')&&demonTypes()>0&&S.hp<maxHp())S.hp=Math.min(maxHp(),S.hp+maxHp()*.0004*tal('impfunnel')*dt);
    if(S.spells.darmor){S.armorT=(S.armorT||0)+dt;if(S.armorT>=2){S.armorT-=2;const h=maxHp()*armorRegen();if(S.hp<maxHp()){S.hp=Math.min(maxHp(),S.hp+h);fly('+'+Math.round(h),'#6fcf3a',null,null,true,'heal');}}}
    if(S.spells.corr){S.corrT+=corrTps()*dt;while(S.corrT>=1&&S.soul>0){S.corrT-=1;tick('dot');}}
    if(S.spells.immo){S.immoT=(S.immoT||0)+immoTps()*dt;while(S.immoT>=1&&S.soul>0){S.immoT-=1;tick('immo');}}
    if(S.coaT>0){S.coaT-=dt;S.coaTick=(S.coaTick||0)+dt;if(S.coaTick>=2){S.coaTick-=2;const elapsed=24-S.coaT;const ramp=(elapsed<8?1:elapsed<16?2:3)*(1+.15*rank('coa'))*(1+.06*tal('agonizing'))*(1+.12*tal('impcoa'))*(1+.02*tal('shmast'));S.coaAcc=(S.coaAcc||0)+ramp;while(S.coaAcc>=1&&S.soul>0){S.coaAcc-=1;S.coaTicking=true;tick('dot');S.coaTicking=false;}}if(S.coaT<=0)log('Bane of Agony faded.');}
    dmgFlush(dt);
    if(S.soul>0){if(S.fear<=0)runAttacker(S,m,dt);
      (S.adds||[]).forEach(a=>{if(S.hp>0)runAttacker(a,addDef(a),dt);});
      if(S.spells.autohs&&S.spells.hstone&&S.shards[1]>=3&&!(S.cds.hs>0)&&S.hp<maxHp()*.3)cast('hs');
      if(S.hp<=0)die();}

    if(!S.dg&&Date.now()-(S.lastInput||0)>60000&&S.hp<maxHp()*.25&&!(S.cds.eat>0)&&S.eatT<=0&&S.corpse>0===false){cast('eat');log('You sit down to eat while nobody is looking.');}
  }
  if(S.eatT>0){S.petProg=0;}else{S.petProg+=petTps()*dt;while(S.petProg>=1&&S.soul>0){S.petProg-=1;tick('pet');}}
  ACH.forEach(a=>{if(!S.ach[a.id]&&a.c(S)){S.ach[a.id]=true;log(`Achievement: ${a.name} (+1% drain speed)`,'good');}});
  render();
}

const PATCHES=[{"v": "0.4.0", "date": "October 27, 2026", "notes": [["Damage numbers","Corruption, Bane of Agony, Immolate, Wrack and your demons now show what they take off the target, each in its own colour, with a star on crits. Shadow Bolt had this already; Drain Soul has the beam."],["Eating is a heal over time","Sit for 20 seconds to regain 80% of your health, 4% a second. Click the target to get up early and keep what you got. Make Camp still fills you to full."],["Quieter level-ups","Only one thing talks at a time: the level card first, then the tutorial tip, then loot and target suggestions. Loot banners only appear for drops worth noting; the rest just go to the log."],["Spell effects","Drain Soul is a living beam: three strands wind round a bright core, it swells on every tick, and fragments of soul ride it from the target into your hand. Drain Life is the same beam in green. Shadow Bolt is a dark orb with a smoke trail that bursts on impact with a ring, sparks and a shadow flash."],["Battle scene","The landscape is laid out like an old Final Fantasy fight: backdrop above the horizon, a floor plane below it, your warlock in front with your demons in a diagonal line behind, the target on the right with its adds lined up behind it, and a cursor over whatever you are draining. Packs are finally visible."],["Crit is 1.5×","Every crit is 1.5× soul instead of double. Ruin now makes Shadow Bolt and Incinerate crits 2× (it no longer pays an extra shard); Pandemic is a milestone that makes Corruption and Bane of Agony crits 2×. Drain Soul crits still always pay a shard."],["Blessing rotates","Blessing of Medivh adds to one stat per rank in turn (Spell power, Haste, Crit, Spirit, Stamina, Hit) and tapers to +0.5 after twelve ranks."],["Normal dungeons keep up","Enemies in a Normal dungeon match your level, up to the top of its band, so Deadmines at 24 is a 24 run."],["Epics start at 45","No Epic drops from any enemy below level 45, and none for a warlock below 45; rare enemies no longer sneak one in early. Dreadmist, the Staff of Jordan and the Tome of Shadow begin at 45, the Fel-Touched Wand at 50, Nightfall Rod and Soul Harvester’s Idol at 55, Felheart at 60. The Auction House no longer sells Epics."],["Karazhan","An endless tower in Deadwind Pass, open at level 60, on the Map. One pull per floor, a boss every fifth floor (Attumen, Moroes, Maiden, the Big Bad Wolf, the Curator, Aran, Netherspite, Malchezaar, Nightbane, then their echoes), each floor 12% more soul and 6% more damage than the last. No eating, no camp, death ends the climb, no lockout. Every floor pays Rare shards and Tower Marks; boss floors add Epics, every 25th floor a Legendary shard. Boss floors are checkpoints. Marks buy the Blessing of Medivh: each rank adds +1 to the next stat in turn (Spell power, Haste, Crit, Spirit, Stamina, Hit), +0.5 after twelve ranks, forever, on every warlock."],["Set library","The Character sheet lists every set you know of: a dungeon set appears once you clear a dungeon that drops it, a world-drop set once you find a piece. Shows each piece, whether you have it and at what tier, and the bonuses for every tier."],["Dungeon lockouts","The 30 minute lockout now starts when you clear the dungeon, not when you walk in. A death or leaving early only locks the door for 5 minutes."],["A real map","The Map is drawn now: zones as regions along the road from Durotar to the Molten Core, dungeons as skulls, the zone elite as a star that fills in once drained. Tap a zone to see its enemies, its elite and its dungeons with the Enter buttons."],["Enemies hit back","First swing lands 0.6s after a fresh target instead of 2s, swings are shorter (1.4s regular, 1.8s casters and brutes, 2s bosses) for the same damage per second, and enemies open with their ability within 2–5s instead of 6–12s. Enemy soul is up about 30% across the board so a Shadow Bolt build still takes a hit or two per kill."],["Heroic and Mythic dungeons","Every dungeon has three tiers. Heroic costs one Epic shard at the door, Mythic one Legendary shard; both scale every enemy to level 58–60 (1.6× / 2.4× soul, 1.4× / 1.8× damage), all bosses are Fear-immune, and Mythic bosses gain a third ability. Heroic bosses drop the dungeon set at Epic quality, ilvl 56, 40% of the time; Mythic bosses always drop one at Epic ilvl 60, raid tier. Set bonuses grow with the tier, and the Mythic 4-piece is an effect: Gloomweaver makes Life Tap free, Hexbinder pays an extra shard on every Drain Soul crit, Emberwrought doubles Immolate. Heroic needs a Normal clear, Mythic a Heroic clear. Each tier has its own 30 minute lockout."],["Itemization rebuilt","Every item now spends one budget, set by item level and quality, across its stats at fixed prices, with Crit the most expensive. Slots lean toward what fits them (wands never roll Stamina, trinkets lean Spirit, hands carry the Hit). Hit on a single piece is capped. Sets and named Epics are built from the same budget at 110%, so a set piece is always a little better than a random drop of its quality before the bonus. Item cards show a value number so you can compare a Spirit piece against a Crit piece. Your existing gear is re-rolled onto the new budget once, keeping its stat mix."],["Gear stats rebuilt","Six stats now: Haste, Crit, Hit, Stamina, Spell power, Spirit. Spell power adds 1% soul per point to every tick and cast you make, and to Drain Life’s heal. Crit rolls on every tick and cast for double; a Drain Soul crit still always pays a shard. Hit is one for one and caps at 17% against your own level. Spirit replaces Regen and Soul affinity: Demon Armor regen, Life Tap shards, and Drain Soul shard chance (1% per 2). Old items convert: Regen to Spirit, Soul affinity to Spirit ×2, Hit ÷3."],["Drain Life ticks","Heals once a second (faster with Haste), crits heal double, Spell power raises it."],["Intensity is an autocast","Five ranks. Your click spell casts itself every 12 / 9 / 7 / 5 / 4 seconds, even while you are away. The old slow-enemy-casts effect is gone."],["Incinerate is a choice","With the talent, a pill on the ability bar switches your clicks between Shadow Bolt and Incinerate. Incinerate hits for 85% and fires an extra Immolate tick per cast."],["Dungeons","Seven dungeons, one per zone band, entered from the Map: Deadmines, Shadowfang Keep, Gnomeregan, Scarlet Monastery, Zul’Farrak, Blackrock Depths and Upper Blackrock Spire. A run is a chain of pulls, some single enemies and some packs of two or three, ending in a boss. No eating and no camp inside, and a death ends the run. 30 minute lockout from the moment you enter. Bosses always drop a Rare and sometimes a piece of a dungeon set (Gloomweaver, Hexbinder, Emberwrought); BRD and UBRS pay an Epic shard. Pack kills pay extra Uncommon shards. Bosses from Gnomeregan on are immune to Fear."],["New zone bosses","VanCleef and Drakkisath now wait at the end of their dungeons. Gazz’uz holds Westfall & The Barrens and Urok Doomhowl holds Blackrock & Winterspring."],["Bags","Right-click a bag item to sell it (Rare and better ask twice), right-click worn gear to unequip, double-click to equip, hold on touch to sell. Hover shows the item against what you wear. New Sell non-upgrades button clears everything no better than your gear; it never sells Legendaries or bought items."],["Character sheet explains itself","Every stat has a line saying what it does and where it comes from, plus a legend for the seven gear stats. Item cards say what each stat does too."],["Shadow Council takes a number","Type how many shards to break (or offerings to make) and press Break or Offer. Enter works too. 1 and All buttons stay for the common cases."],["Enemies swing", "Melee damage now lands as hits on a timer (every 2 seconds, 2.6 for casters and brutes, 2 for bosses) instead of a steady drain. Total damage over time is unchanged. About 5% of swings miss, 8% with a Voidwalker out."], ["Enrage is speed, not damage", "An enraged enemy swings twice as fast rather than hitting twice as hard."], ["Every enemy has a trick", "From level 10 on, every enemy is a caster, a brute or a stalker. Stalkers wind up and land three fast hits. Casters and brutes still pay 25% more; stalkers pay 10% more."], ["Faster casts in later zones", "Enemies use their ability every 14 seconds in the first zone, a second sooner per zone, down to 9 seconds in Blackrock and Molten Core."], ["Bosses alternate two abilities", "Each zone boss now has a second ability and switches between them."], ["Fear has a cost", "A feared enemy may come back with a friend (35% chance, up to 50% in later zones). The add fights beside your target and steps up when the target dies. Rare (blue) enemies resist Fear half the time."], ["Bosses immune to Fear from Mandokir on", "Bloodlord Mandokir, Maltorius, Drakkisath and Ragnaros cannot be feared. Spell Lock from a Felhunter is the interrupt for them."], ["Spell Lock and Death Coil interrupt everything", "Including any add that is casting. Fear only interrupts your target."], ["Boss melee softened", "Boss hits are a little lighter now that they land in chunks, so a swing and a bolt together do not take you from full to dead."]]},{"v": "0.3.0", "date": "October 18, 2026", "notes": [["Slower leveling past 20", "Levels after 20 need more XP, about 3x the play time by level 40 and up. This leaves room for dungeons later."], ["New legacy perk: Old Hand", "+25% XP per rank from level 20 on. 2 ranks, 1 point each."], ["New: Make Camp", "Buy the Camping Kit in the Gold Shop (200g). Rest by a campfire for 20 seconds to become Well Rested: +50% XP for 30 minutes. 2 hour cooldown."], ["Ritual of Doom, earlier", "1 legacy point after two zone bosses, 2 after four. Each early tier pays once. Ragnaros always pays 3."], ["Sacrifice keeps your Voidwalker", "Sacrifice no longer uses one up. Instead your Voidwalkers stop attacking for its 60 second cooldown."], ["Sacrifice shield lasts 20 seconds", "The shield fades after 20 seconds if it has not been used up. The cooldown stays 60 seconds."], ["Soulstone cooldown", "Once a Soulstone has pulled you back from death, you cannot make another for one hour."], ["Soulstone no longer scares enemies", "The Soulstone brings you back at half health and nothing more."], ["Level up shows what you got","Each level now opens a notice with your health gain, any talent point, what the trainer can teach you (new spells and ranks) and any demon you can summon. Click Got it to close it."], ["Epics scale with item level","Epics are still named items, but a higher item level one is now stronger. A piece has its listed stats at the top of its tier and less below that."], ["Dying resets the enemy","When you die, the enemy goes back to full health. Start it again or pick a different one."], ["Enemies far above your level", "A mob 5 levels above you is missed most of the time, and anything higher is almost impossible to hit. Past 5 levels above you, enemies also hit harder. Fight what is near your level."], ["Demon limits on older saves", "If you had more of a demon than its limit, the extras are released and the Common shards they cost are refunded."], ["Healthstones", "Healthstone is just used from the action bar for 3 Uncommon shards and goes on a 60 second cooldown. There is nothing to create first."], ["Improved Health Funnel", "Now a flat 0.04% of max health per second per rank while you have a demon. It no longer scales with how many kinds you own."], ["Infernals", "An Infernal you are fighting no longer burns out. It stays until one of you falls."], ["Character sheet", "Each stat shows its total, the base and what gear adds, grouped into Damage, Shards and Survival."], ["Item tooltips", "Show the item you picked with your equipped item under it."], ["Auction House", "Items you buy are never auto-sold."], ["Action bar and menus", "Curses first, then damage, then defensives, then Fear and Life Tap. Menus reordered, and the map only opens your current zone."]]}];

    <p><b>The drain.</b> You channel Drain Soul on your target. The purple cast bar fills up, and when it fills, that is one tick. Each tick takes 1 off the target’s health and has a chance (shown in the stats) to give you a shard. Until you train Drain Soul at level 10 you have no channel at all and shards come only from kills; after that it ticks on its own and each of your ticks can drain a shard. When the target’s health hits 0 it dies, pays out its death shards, gives XP, maybe drops gear, and the next one steps up.</p>

    <p><b>Damage and dying.</b> The target hits you the whole time. Demon Armor regenerates a little, Sacrifice trades a minute of Voidwalker damage for a big shield, Healthstones and Drain Life heal. If you die you keep everything; your channel is just down for the corpse run, and clicking the landscape runs it off faster.</p>
    <p><b>Enemy abilities.</b> Casters wind up a big bolt and brutes an enrage on an orange bar under their health. Fear interrupts any enemy, Death Coil interrupts anything, and a Felhunter gives you Spell Lock, a dedicated interrupt. Bosses have a signature ability. Casters and brutes pay 25% more shards and XP. If you are away and low, your warlock sits to eat on her own when the meal is ready.</p>
    <p><b>Levels and colour.</b> Mobs are coloured by level: grey mobs give nothing at all, green are easy, yellow fair, orange dangerous, red will kill you. Higher mobs have more health, hit harder, and roll better shard rarities. The green banner tells you when something harder is within reach.</p>

    <p><b>Gold.</b> From selling junk and gear. It survives the Ritual of Doom and pays for training, bags, account perks, and the Auction House (A), which lists six pieces of gear around your level and restocks every 30 minutes.</p>

// ---------- transfer codes (shared with the addon; this numbering is canonical) ----------
function exportCode(){const c=Object.assign({},S);c.cds={};c.event=null;c.fighting=null;c.corpse=0;c.lootQ=[];c.cleared=[0,1,2,3,4,5].map(i=>!!S.cleared[i]);c.seen=[0,1,2,3,4].map(i=>!!S.seen[i]);c.source='web';
  return 'DS1.'+btoa(unescape(encodeURIComponent(JSON.stringify(c))));}
function clampDemons(){DEMONS.forEach(d=>{const n=S.demons[d.id]||0,mx=d.max;if(n>mx){let refund=0;for(let k=mx;k<n;k++)refund+=Math.floor(d.cost*Math.pow(1.15,k));S.demons[d.id]=mx;S.shards[0]+=refund;log(`Demon limits: ${n-mx} extra ${d.name}${n-mx>1?'s':''} released. Refunded ${fmt(refund)} Common shards.`,'good');}});}
function importCode(code){code=(code||'').replace(/\s/g,'');if(code.slice(0,4)!=='DS1.')return 'Not a Shardlock Idle code.';let d;
  try{d=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));}catch(e){return 'Could not read that code.';}
  if(!d||typeof d.lvl!=='number')return 'Could not read that code.';
  const f=freshState();for(const k in d){if(k!=='source')f[k]=d[k];}
  const arr=(x,n,def)=>{const o=[];for(let i=0;i<n;i++)o[i]=Array.isArray(x)?(x[i]??def):(x&&x[i]!==undefined?x[i]:def);return o;};
  f.shards=arr(d.shards,5,0).map(Number);f.seen=arr(d.seen,5,false).map(Boolean);f.cleared=arr(d.cleared,6,false).map(Boolean);
  if(!Array.isArray(f.bag))f.bag=Object.values(f.bag||{});f.lootQ=[];f.gear=f.gear&&!Array.isArray(f.gear)?f.gear:{};
  for(const k of ['tal','ranks','spells','ach','flags','demons','emp','bossDead','dgLock','dgCleared'])if(!f[k]||typeof f[k]!=='object'||Array.isArray(f[k]))f[k]={};
  if(!Array.isArray(f.adds))f.adds=[];f.cast=null;for(const sl in (f.gear||{}))migrateItem(f.gear[sl]);(f.bag||[]).forEach(migrateItem);if(f.tal&&f.tal.intensity>5)f.tal.intensity=5;if(!Array.isArray(f.dgPack))f.dgPack=[];if(f.dg&&!f.dg.kz&&(!DUNGEONS[f.dg.id]||f.dg.step>=DUNGEONS[f.dg.id].steps.length))f.dg=null;if(!f.kz||typeof f.kz!=='object')f.kz={best:0,marks:0,bless:0};
  if(!f.legacy||typeof f.legacy!=='object')f.legacy={points:0,perks:{}};if(!f.legacy.perks)f.legacy.perks={};
  if(!f.account||typeof f.account!=='object')f.account={gold:0,perks:{}};if(!f.account.perks)f.account.perks={};f.account.gold=Number(f.account.gold)||0;
  DEMONS.forEach(dm=>f.demons[dm.id]=Number(f.demons[dm.id])||0);
  f.zone=Math.max(0,Math.min(5,Number(d.zone)||0));f.mob=Math.max(0,Math.min(4,Number(d.mob)||0));
  f.cds={};f.event=null;f.fighting=null;f.corpse=0;f.mode='drain';f.spells.darmor=true;if(f.lvl>=10)f.spells.drainsoul=true;f.last=Date.now();
  S=f;clampDemons();buildPickers();spawn();tabDirty=true;save();log('Progress imported.','good');return null;}

function load(){
  try{const raw=localStorage.getItem('drainsoul3');if(!raw)return;const d=JSON.parse(raw);S=Object.assign(freshState(),d);S.corpse=0;S.event=null;S.fighting=null;S.mode='drain';S.lifeT=0;S.hp=Math.max(1,Math.min(maxHp(),S.hp));
    Object.values(S.gear).forEach(it=>{if(it&&it.stats&&it.q<3)it.name=itemName(it);});S.bag.forEach(it=>{if(!it.junk&&it.stats&&it.q<3)it.name=itemName(it);});S.spells.darmor=true;if(S.lvl>=10&&S.spells.drainsoul===undefined)S.spells.drainsoul=true;clampDemons();
    const gap=Math.min(12*3600,(Date.now()-(S.last||Date.now()))/1000);
    if(gap>0){if((S.cds.camp||0)>0)S.cds.camp=Math.max(0,S.cds.camp-gap);if((S.cds.craftSs||0)>0)S.cds.craftSs=Math.max(0,S.cds.craftSs-gap);if((S.restedT||0)>0)S.restedT=Math.max(0,S.restedT-gap);if(S.camping){S.camping=false;S.eatT=0;}}
    if(gap>60&&!noShards(curMob())){const m=curMob();const tps=youTps()+corrTps()+immoTps()+petTps();const ticks=tps*gap*(1-resistChance());const need=soulNeed(m);const souls=Math.floor(ticks/need);
      const chance=shardChance()*drainTps()/Math.max(tps,1e-9);
      let sh=Math.floor(ticks*chance)+souls*deathShards(m);const startLvl=S.lvl;
      for(let i=0;i<Math.min(souls,5000);i++)gainXp(xpFor(m));if(souls>5000)gainXp(xpFor(m)*(souls-5000));
      S.souls+=souls;const tickSh=Math.floor(ticks*chance),deathSh=souls*deathShards(m);for(let i=0;i<Math.min(tickSh,20000);i++){const r=rollRarity(m,'tick');S.shards[r]++;S.life++;S.seen[r]=true;}for(let i=0;i<Math.min(deathSh,20000);i++){const r=rollRarity(m,'death');S.shards[r]++;S.life++;S.seen[r]=true;}if(sh>40000){S.shards[0]+=sh-40000;S.life+=sh-40000;}
      const junkN=Math.floor(souls*.35);for(let i=0;i<Math.min(junkN,400);i++){if(!addToBag({junk:true,name:JUNK[S.zone][i%4],ilvl:m.l,q:0,count:1,price:junkPrice(m.l,false)}))break;}
      if(souls>0)log(`While you were away you drained ${fmt(souls)} souls for ${fmt(sh)} shards${S.lvl>startLvl?' and reached level '+S.lvl:''}.`,'good');}
  }catch(e){S=freshState();}
}
// ---------- target suggestions ----------
function suggestion(){
  if(S.fighting==='ev'||S.corpse>0)return null;
  const z=ZONES[S.zone];
  if(S.mob<4){for(let i=3;i>S.mob;i--){if(z.mobs[i].l<=S.lvl+1)return {zone:S.zone,mob:i,n:z.mobs[i].n,l:z.mobs[i].l,why:'is a fair fight at your level'};}
    if(!S.cleared[S.zone]&&z.elite.l<=S.lvl+1&&bossLock(S.zone)<=0)return {zone:S.zone,mob:4,n:z.elite.n,l:z.elite.l,why:'is within reach. Drain the elite to open the next zone'};}
  if(S.cleared[S.zone]&&ZONES[S.zone+1]&&(S.mob===4||z.mobs[3].l<S.lvl-2)){const nz=ZONES[S.zone+1];if(nz.mobs[0].l<=S.lvl+1)return {zone:S.zone+1,mob:0,n:nz.mobs[0].n,l:nz.mobs[0].l,why:'in '+nz.name+' is waiting'};}
  return null;
}
$('loot').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();const uid=+b.dataset.uid;
  if(b.dataset.a==='equip')equipFromBag(uid);else if(b.dataset.a==='sell')sellFromBag(uid);else if(b.dataset.a==='later')S.lastDrop=null;
  lootKey=null;tabDirty=true;});
let lootKey='',lootShownAt=0;
function renderLoot(){if(S.lastDrop&&lootShownAt&&Date.now()-lootShownAt>15000){S.lastDrop=null;}
  let it=S.lastDrop?S.bag.find(x=>x.uid===S.lastDrop):null;if(it&&!worthNoting(it)){S.lastDrop=null;it=null;}const full=S.bag.length>=bagCap();const key=(it?it.uid:'')+':'+(full?'F':'');if(key===lootKey)return;if(it&&overlayBusy())return;lootKey=key;lootShownAt=it?Date.now():0;
  let h='';
  if(it)h+=`<div class="event" style="background:#1a1a3a;border-color:${['#bdbdbd','#1eff00','#4aa3ff','#a335ee','#ff8000'][it.q]}"><span>🎁 Loot: ${itemHtml(it)}<br><span class="muted cmp" style="font-size:12px">${equippedLine(it)}</span></span><span style="display:flex;gap:6px"><button data-a="equip" data-uid="${it.uid}">Equip</button><button data-a="sell" data-uid="${it.uid}">Sell ${sellPrice(it)}g</button><button data-a="later" data-uid="${it.uid}">Keep in bag</button></span></div>`;
  if(full)h+=`<div class="event" style="background:#3a1515;border-color:#ff6b6b"><span>🎒 Your bags are full. New loot is being left behind. Sell junk on the Gear tab.</span></div>`;
  setHTML('loot',h);}
let sugKey='',sugShownAt=0;
function renderSuggest(){
  const m=curMob();
  if(S.fighting!=='ev'&&noShards(m)&&!(S.flags.greyWarned===S.zone+':'+S.mob)){S.flags.greyWarned=S.zone+':'+S.mob;log(`${m.n} is grey to you now: no XP, no shards. Move on.`,'bad');}
  const s=suggestion();const key=s?`${s.zone}:${s.mob}:${S.lvl}`:'';
  if(s&&S.dismissed===key){if(sugKey){sugKey='';$('suggest').innerHTML='';}return;}
  if(s&&key===sugKey&&sugShownAt&&Date.now()-sugShownAt>15000){S.dismissed=key;return;}
  if(key===sugKey)return;if(s&&(overlayBusy()||Date.now()-(S.lvlAt||0)<20000))return;sugKey=key;sugShownAt=s?Date.now():0;
  $('suggest').innerHTML=s?`<div class="event" style="background:#1f3317;border-color:var(--fel)"><span>⚔️ You are level ${S.lvl}. ${s.n} (Lv ${s.l}) ${s.why}. Harder souls pay more XP and better shards.</span><span style="display:flex;gap:6px"><button data-a="go" data-z="${s.zone}" data-m="${s.mob}">Face it</button><button data-a="no" data-key="${key}">Later</button></span></div>`:'';
}
$('suggest').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();
  if(b.dataset.a==='go'){if(S.dg)dgLeave('leave');S.zone=+b.dataset.z;S.mob=+b.dataset.m;S.fighting=null;buildPickers();spawn();}
  else if(b.dataset.a==='no'){S.dismissed=b.dataset.key;}});

let coachSet=null,coachI=0,coachHl=null,coachQ=false;
function coachTut(){return S.account.tut||(S.account.tut={});}
function coachHide(){const c=$('coach');c.classList.remove('show');if(coachHl){coachHl.classList.remove('coachhl');coachHl=null;}}
function coachShow(){
  const st=COACH[coachSet][coachI],n=COACH[coachSet].length,c=$('coach');
  if(coachHl){coachHl.classList.remove('coachhl');coachHl=null;}
  const el=st.sel&&document.querySelector(st.sel);if(el){el.classList.add('coachhl');coachHl=el;}
  const last=coachI===n-1;
  c.innerHTML=`<h4>${st.t}</h4>${st.h}<div class="cnav"><span><button class="skip" data-c="skip">${last?'':'Skip tips'}</button><span class="cdots">${coachI+1} / ${n}</span></span><span style="display:flex;gap:6px">${st.win?`<button data-c="open">${st.wl}</button>`:''}<button class="go" data-c="next">${last?'Got it':'Next'}</button></span></div>`;
  c.classList.add('show');
}
function coachStart(set){if(coachSet&&$('coach').classList.contains('show'))return;coachSet=set;coachI=0;coachShow();}
function coachEnd(){coachTut()[coachSet]=true;coachHide();save();}
$('coach').addEventListener('pointerdown',e=>{
  const b=e.target.closest('button');e.stopPropagation();if(!b)return;e.preventDefault();
  const a=b.dataset.c;
  if(a==='skip')coachEnd();
  else if(a==='next'){const w=COACH[coachSet][coachI].win;if(w&&winOpen===w)closeWin();if(coachI>=COACH[coachSet].length-1)coachEnd();else{coachI++;coachShow();}}
  else if(a==='open'){const w=COACH[coachSet][coachI].win;if(winOpen!==w)openWin(w);}
});
function coachMaybeIntro(){const t=coachTut();if(S.lvl>=3){t.intro=true;t.levelup=true;}if(!t.intro&&S.lvl===1)setTimeout(()=>coachStart('intro'),700);}
